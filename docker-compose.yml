services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: upk-restoran-app
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      APP_URL: http://localhost:8001/frontend
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: db_restoran
      DB_USER: upk_user
      DB_PASS: upk_password
    ports:
      - "8001:80"
    volumes:
      - .:/var/www/html:z

  mysql:
    image: mysql:8.0
    container_name: upk-restoran-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_restoran
      MYSQL_USER: upk_user
      MYSQL_PASSWORD: upk_password
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/sql:/docker-entrypoint-initdb.d:ro

  phpmyadmin:
    image: phpmyadmin:5.2.1
    container_name: upk-restoran-phpmyadmin
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "${PMA_PORT:-8080}:80"

volumes:
  mysql_data:
